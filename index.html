<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>띵타 유저상점 시세</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  background: #0b0e13;
  color: #e9edf5;

  font-family:
    Arial,
    "Noto Sans KR",
    sans-serif;
}

body {
  min-height: 100vh;
}

.container {
  max-width: 1450px;
  margin: auto;
  padding: 30px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 20px;
  margin-bottom: 25px;
}

.title {
  font-size: 30px;
  font-weight: 900;
}

.subtitle {
  margin-top: 6px;
  color: #7f8795;
  font-size: 14px;
}

.search {
  width: 300px;

  padding: 13px 16px;

  border: 1px solid #252b35;
  border-radius: 10px;

  outline: none;

  background: #131821;
  color: white;

  font-size: 14px;
}

.search:focus {
  border-color: #536dfe;
}

.multiply-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}

.multiply-check {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #e9edf5;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  user-select: none;
}

.multiply-check input {
  margin: 0;
  accent-color: #536dfe;
}

.multiply-input {
  width: 75px;
  padding: 9px 10px;
  border: 1px solid #252b35;
  border-radius: 8px;
  outline: none;
  background: #131821;
  color: white;
  font-size: 14px;
  font-weight: 700;
  text-align: right;
}

.multiply-input:focus {
  border-color: #536dfe;
}

.multiply-input::-webkit-inner-spin-button,
.multiply-input::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.multiply-input {
  -moz-appearance: textfield;
}

.multiply-symbol {
  display: none;
}

.market-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 15px 18px;
  margin-bottom: 18px;

  background: #11151c;

  border: 1px solid #202630;
  border-radius: 12px;
}

.market-status {
  color: #8d96a5;
  font-size: 13px;
}

.grid {
  display: grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(260px, 1fr)
    );

  gap: 14px;
}

.card {
  position: relative;

  padding: 20px;

  background: #11151c;

  border: 1px solid #202630;
  border-radius: 14px;

  cursor: pointer;

  transition:
    transform .15s,
    border-color .15s,
    background .15s;
}

.card:hover {
  transform: translateY(-2px);

  border-color: #394252;

  background: #151a22;
}

.item-name {
  font-size: 16px;
  font-weight: 700;

  margin-bottom: 14px;
}

.current-price {
  font-size: 27px;
  font-weight: 900;

  margin-bottom: 8px;
}

.change {
  font-size: 14px;
  font-weight: 800;
}

.up {
  color: #ff4d4d;
}

.down {
  color: #4d8dff;
}

.same {
  color: #89919f;
}

.info {
  margin-top: 16px;
  padding-top: 13px;

  border-top: 1px solid #202630;

  display: flex;
  justify-content: space-between;

  color: #737c8b;

  font-size: 12px;
}

.loading {
  grid-column: 1 / -1;

  text-align: center;

  padding: 80px 20px;

  color: #747d8c;
}

.detail {
  display: none;

  position: fixed;

  inset: 0;

  background: rgba(5, 7, 10, .86);

  backdrop-filter: blur(8px);

  z-index: 100;
}

.detail-box {
  position: absolute;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  width: min(
    900px,
    calc(100% - 30px)
  );

  max-height: calc(100vh - 40px);

  overflow: hidden;

  padding: 28px;

  background: #11151c;

  border: 1px solid #2a313d;

  border-radius: 18px;

  box-shadow:
    0 20px 70px rgba(0,0,0,.5);

  display: flex;
  flex-direction: column;
}

.detail-close {
  position: absolute;

  right: 18px;
  top: 12px;

  font-size: 28px;

  color: #737c8b;

  cursor: pointer;

  z-index: 5;
}

.detail-close:hover {
  color: white;
}

.detail-name {
  font-size: 26px;
  font-weight: 900;

  margin-bottom: 8px;

  padding-right: 40px;
}

.detail-price {
  font-size: 40px;
  font-weight: 900;

  margin-bottom: 8px;
}

.detail-change {
  font-size: 17px;
  font-weight: 800;

  margin-bottom: 20px;
}

.detail-grid {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 10px;

  margin-bottom: 20px;
}

.detail-stat {
  padding: 14px;

  background: #0c1016;

  border: 1px solid #202630;

  border-radius: 10px;
}

.detail-label {
  color: #737c8b;

  font-size: 12px;

  margin-bottom: 7px;
}

.detail-value {
  font-size: 16px;
  font-weight: 700;
}

.history-title {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 10px;

  font-size: 16px;
  font-weight: 800;
}

.history-count {
  color: #737c8b;

  font-size: 12px;
  font-weight: normal;
}

.history {
  min-height: 100px;

  max-height: 360px;

  overflow-y: auto;

  border: 1px solid #202630;

  border-radius: 12px;

  background: #0c1016;
}

.history-row {
  display: grid;

  grid-template-columns:
    180px
    1fr
    130px
    180px;

  align-items: center;

  gap: 10px;

  padding: 13px 15px;

  border-bottom: 1px solid #1d232d;

  font-size: 13px;
}

.history-row:last-child {
  border-bottom: none;
}

.history-time {
  color: #737c8b;

  white-space: nowrap;
}

.history-name {
  font-weight: 700;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}

.history-price {
  text-align: right;

  font-weight: 800;

  white-space: nowrap;
}

.history-change {
  text-align: right;

  font-weight: 800;

  white-space: nowrap;
}

.no-history {
  padding: 50px 20px;

  text-align: center;

  color: #737c8b;
}

@media (max-width: 800px) {

  .container {
    padding: 18px;
  }

  .header {
    flex-direction: column;
    align-items: stretch;
  }

  .search {
    width: 100%;
  }

  .market-bar {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }

  .multiply-controls {
    width: 100%;
  }

  .multiply-input {
    flex: 1;
  }

  .multiply-check {
    flex: 1;
    justify-content: center;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .detail-box {
    padding: 20px;
  }

  .detail-grid {
    grid-template-columns: 1fr 1fr;
  }

  .history-row {
    grid-template-columns:
      130px
      1fr
      100px
      140px;

    font-size: 12px;
  }
}

@media (max-width: 600px) {

  .detail-grid {
    grid-template-columns: 1fr;
  }

  .history-row {
    grid-template-columns:
      1fr
      100px;
  }

  .history-time {
    grid-column: 1 / -1;
  }

  .history-name {
    display: none;
  }
}

</style>
</head>


<body>

<div class="container">

  <div class="header">

    <div>

      <div class="title">
        띵타 유저상점 시세
      </div>

      <div class="subtitle">
        실시간 아이템 시장 가격
      </div>

    </div>

    <input
      id="search"
      class="search"
      placeholder="아이템 검색..."
    >

  </div>


  <div class="market-bar">

    <div>
      <strong>
        전체 시장
      </strong>
    </div>

    <div
      id="status"
      class="market-status"
    >
      데이터 불러오는 중...
    </div>

    <div class="multiply-controls">
      <label class="multiply-check">
        <input
          id="multiplyEnabled"
          type="checkbox"
        >
        <span>배수:</span>
      </label>

      <input
        id="multiplyCount"
        class="multiply-input"
        type="number"
        min="1"
        step="1"
        value="64"
        title="배수"
      >
    </div>

  </div>


  <div
    id="grid"
    class="grid"
  >

    <div class="loading">
      시세 데이터를 불러오는 중...
    </div>

  </div>

</div>


<div
  id="detail"
  class="detail"
>

  <div
    class="detail-box"
  >

    <div
      id="detailClose"
      class="detail-close"
    >
      ×
    </div>


    <div
      id="detailName"
      class="detail-name"
    ></div>


    <div
      id="detailPrice"
      class="detail-price"
    ></div>


    <div
      id="detailChange"
      class="detail-change"
    ></div>


    <div class="detail-grid">

      <div class="detail-stat">

        <div class="detail-label">
          현재 가격
        </div>

        <div
          id="statCurrent"
          class="detail-value"
        ></div>

      </div>


      <div class="detail-stat">

        <div class="detail-label">
          이전 가격
        </div>

        <div
          id="statPrevious"
          class="detail-value"
        ></div>

      </div>


      <div class="detail-stat">

        <div class="detail-label">
          거래 횟수
        </div>

        <div
          id="statTransactions"
          class="detail-value"
        ></div>

      </div>

    </div>


    <div class="history-title">

      <span>
        가격 기록
      </span>

      <span
        id="historyCount"
        class="history-count"
      ></span>

    </div>


    <div
      id="history"
      class="history"
    >

      <div class="no-history">
        가격 기록을 불러오는 중...
      </div>

    </div>

  </div>

</div>


<script>

/*
 * =====================================================
 * Cloudflare Worker API 주소
 *
 * GitHub Pages -> Worker -> Apps Script -> Sheets
 * 구조이므로 여기에는 Apps Script URL이 아니라
 * Worker URL을 넣는다.
 * =====================================================
 */

const API_URL =
  "https://late-water-2fc2.blackhoodty2023.workers.dev/";


let marketData = [];

let currentItem = null;


/*
 * =====================================================
 * 데이터 불러오기
 * =====================================================
 */

async function loadData() {

  const status =
    document.getElementById("status");

  const grid =
    document.getElementById("grid");

  try {

    status.textContent =
      "데이터 불러오는 중...";


    const response =
      await fetch(
        API_URL +
        "?market=true"
      );


    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }


    const result =
      await response.json();


    if (
      !result ||
      result.success !== true ||
      !Array.isArray(result.items)
    ) {
      throw new Error(
        "잘못된 데이터 형식"
      );
    }


    marketData = result.items;


    render();


    status.textContent =
      "아이템 " +
      marketData.length +
      "개";


  } catch (error) {

    console.error(
      "시장 데이터 오류:",
      error
    );


    status.textContent =
      "데이터를 불러오지 못했습니다.";


    grid.innerHTML = `
      <div class="loading">
        데이터를 불러오지 못했습니다.<br>
        <small>
          브라우저 개발자 도구(F12)의 Console을 확인하세요.
        </small>
      </div>
    `;

  }

}


/*
 * =====================================================
 * 숫자
 * =====================================================
 */

function number(value) {

  return Number(value || 0)
    .toLocaleString("ko-KR");

}


/*
 * =====================================================
 * 가격 배수
 * =====================================================
 */

function getMultiplier() {

  const enabled =
    document.getElementById("multiplyEnabled").checked;

  if (!enabled) {
    return 1;
  }

  const value =
    Number(
      document.getElementById("multiplyCount").value
    );

  return Number.isFinite(value) && value > 0
    ? value
    : 1;

}


function multipliedPrice(value) {

  return (
    Number(value) || 0
  ) * getMultiplier();

}


/*
 * =====================================================
 * 날짜
 * =====================================================
 */

function date(value) {

  if (!value) {
    return "-";
  }


  const d =
    new Date(value);


  if (isNaN(d.getTime())) {
    return "-";
  }


  return d.toLocaleString(
    "ko-KR",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }
  );

}


/*
 * =====================================================
 * HTML escape
 * =====================================================
 */

function escapeHtml(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/*
 * =====================================================
 * 카드 렌더링
 * =====================================================
 */

function render() {

  const grid =
    document.getElementById(
      "grid"
    );


  const search =
    document.getElementById(
      "search"
    );


  const keyword =
    search.value
      .trim()
      .toLowerCase();


  const filtered =
    marketData.filter(
      item => {

        return String(
          item.name || ""
        )
        .toLowerCase()
        .includes(keyword);

      }
    );


  if (filtered.length === 0) {

    grid.innerHTML = `
      <div class="loading">
        등록된 데이터가 없습니다.
      </div>
    `;

    return;
  }


  grid.innerHTML =
    filtered
      .map(item => {

        const current =
          Number(
            item.currentPrice
          ) || 0;


        const previous =
          Number(
            item.previousPrice
          ) || 0;


        const displayCurrent =
          multipliedPrice(current);

        const displayPrevious =
          multipliedPrice(previous);

        const change =
          displayCurrent - displayPrevious;


        let rate = 0;


        if (previous !== 0) {

          rate =
            (
              change /
              previous
            ) * 100;

        }


        let className =
          "same";


        let arrow =
          "—";


        if (change > 0) {

          className =
            "up";

          arrow =
            "▲";

        }

        else if (change < 0) {

          className =
            "down";

          arrow =
            "▼";

        }


        const sign =
          change > 0
            ? "+"
            : "";


        return `

          <div
            class="card"
            data-item="${escapeHtml(item.name)}"
          >

            <div class="item-name">
              ${escapeHtml(item.name)}${
                document.getElementById("multiplyEnabled").checked
                  ? " X " + number(getMultiplier())
                  : ""
              }
            </div>


            <div class="current-price">
              ${number(displayCurrent)} G
            </div>


            <div
              class="change ${className}"
            >

              ${arrow}

              ${sign}${number(change)} G

              (${sign}${rate.toFixed(2)}%)

            </div>


            <div class="info">

              <span>
                거래 ${number(item.transactionCount)}회
              </span>

              <span>
                ${date(item.timestamp)}
              </span>

            </div>

          </div>

        `;

      })
      .join("");

}


/*
 * =====================================================
 * 카드 클릭
 * =====================================================
 */

document
  .getElementById("grid")
  .addEventListener(
    "click",
    function(event) {

      const card =
        event.target.closest(
          ".card"
        );


      if (!card) {
        return;
      }


      openDetail(
        card.dataset.item
      );

    }
  );


/*
 * =====================================================
 * 상세
 * =====================================================
 */

function openDetail(itemName) {

  const item =
    marketData.find(
      item =>
        item.name === itemName
    );


  if (!item) {
    return;
  }


  currentItem =
    item;


  const current =
    Number(
      item.currentPrice
    ) || 0;


  const previous =
    Number(
      item.previousPrice
    ) || 0;


  const displayCurrent =
    multipliedPrice(current);

  const displayPrevious =
    multipliedPrice(previous);

  const change =
    displayCurrent - displayPrevious;


  let rate = 0;


  if (previous !== 0) {

    rate =
      (
        change /
        previous
      ) * 100;

  }


  let className =
    "same";


  let arrow =
    "—";


  if (change > 0) {

    className =
      "up";

    arrow =
      "▲";

  }

  else if (change < 0) {

    className =
      "down";

    arrow =
      "▼";

  }


  const sign =
    change > 0
      ? "+"
      : "";


  document
    .getElementById(
      "detailName"
    )
    .textContent =
      item.name +
      (
        document.getElementById("multiplyEnabled").checked
          ? " X " + number(getMultiplier())
          : ""
      );


  document
    .getElementById(
      "detailPrice"
    )
    .textContent =
      number(current) +
      " G";


  const changeElement =
    document.getElementById(
      "detailChange"
    );


  changeElement.className =
    "detail-change " +
    className;


  changeElement.textContent =
    arrow +
    " " +
    sign +
    number(change) +
    " G (" +
    sign +
    rate.toFixed(2) +
    "%)";


  document
    .getElementById(
      "statCurrent"
    )
    .textContent =
      number(displayCurrent) +
      " G";


  document
    .getElementById(
      "statPrevious"
    )
    .textContent =
      number(previous) +
      " G";


  document
    .getElementById(
      "statTransactions"
    )
    .textContent =
      number(
        item.transactionCount
      ) +
      "회";


  document
    .getElementById(
      "detail"
    )
    .style.display =
      "block";


  loadHistory(item.name);

}


/*
 * =====================================================
 * 가격 기록
 * =====================================================
 */

async function loadHistory(itemName) {

  const history =
    document.getElementById(
      "history"
    );


  const count =
    document.getElementById(
      "historyCount"
    );


  history.innerHTML = `
    <div class="no-history">
      가격 기록을 불러오는 중...
    </div>
  `;


  count.textContent = "";


  try {

    const response =
      await fetch(
        API_URL +
        "?history=true&item=" +
        encodeURIComponent(
          itemName
        )
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    if (
      !result ||
      result.success !== true ||
      !Array.isArray(result.history)
    ) {

      throw new Error(
        "잘못된 기록 데이터"
      );

    }


    const records =
      result.history;


    count.textContent =
      records.length +
      "개 기록";


    renderHistory(
      records
    );


  } catch (error) {

    console.error(
      "가격 기록 오류:",
      error
    );


    history.innerHTML = `
      <div class="no-history">
        가격 기록을 불러오지 못했습니다.
      </div>
    `;

  }

}


/*
 * =====================================================
 * 가격 기록 렌더링
 * =====================================================
 */

function renderHistory(records) {

  const history =
    document.getElementById(
      "history"
    );


  if (records.length === 0) {

    history.innerHTML = `
      <div class="no-history">
        아직 가격 기록이 없습니다.
      </div>
    `;

    return;

  }


  const sorted =
    [...records].sort(
      (a, b) =>
        new Date(b.timestamp) -
        new Date(a.timestamp)
    );


  history.innerHTML =
    sorted
      .map(record => {

        const change =
          Number(
            record.change
          ) || 0;


        const rate =
          Number(
            record.changeRate
          ) || 0;


        let className =
          "same";


        let arrow =
          "—";


        let sign =
          "";


        if (change > 0) {

          className =
            "up";

          arrow =
            "▲";

          sign =
            "+";

        }

        else if (change < 0) {

          className =
            "down";

          arrow =
            "▼";

        }


        if (
          record.direction ===
          "신규"
        ) {

          className =
            "same";

          arrow =
            "●";

          sign =
            "";

        }


        const changeText =
          record.direction ===
          "신규"

            ? ""

            : " (" +
              sign +
              rate.toFixed(2) +
              "%)";


        return `

          <div class="history-row">

            <div class="history-time">
              ${date(record.timestamp)}
            </div>

            <div class="history-name">
              ${escapeHtml(record.name || "")}
            </div>

            <div class="history-price">
              ${number(record.price)} G
            </div>

            <div
              class="history-change ${className}"
            >
              ${arrow}
              ${sign}${number(change)} G
              ${changeText}
            </div>

          </div>

        `;

      })
      .join("");

}


/*
 * =====================================================
 * 닫기
 * =====================================================
 */

function closeDetail() {

  document
    .getElementById(
      "detail"
    )
    .style.display =
      "none";


  currentItem =
    null;

}


document
  .getElementById(
    "detailClose"
  )
  .addEventListener(
    "click",
    closeDetail
  );


document
  .getElementById(
    "detail"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        this
      ) {

        closeDetail();

      }

    }
  );


document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key ===
      "Escape"
    ) {

      closeDetail();

    }

  }
);


/*
 * =====================================================
 * 검색
 * =====================================================
 */

document
  .getElementById(
    "search"
  )
  .addEventListener(
    "input",
    render
  );


/*
 * =====================================================
 * 가격 배수 입력
 * =====================================================
 */

document
  .getElementById("multiplyEnabled")
  .addEventListener(
    "change",
    function() {

      render();

      if (currentItem) {
        openDetail(currentItem.name);
      }

    }
  );


document
  .getElementById("multiplyCount")
  .addEventListener(
    "input",
    function() {

      render();

      if (currentItem) {
        openDetail(currentItem.name);
      }

    }
  );


/*
 * =====================================================
 * 최초 실행
 * =====================================================
 */

loadData();


/*
 * =====================================================
 * 30초마다 갱신
 * =====================================================
 */

setInterval(
  loadData,
  600000
);

</script>

</body>
</html>
