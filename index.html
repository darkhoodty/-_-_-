<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>띵타이쿤 시세</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- 헤더 -->
    <header class="header">
        <div>
            <h1>띵타이쿤 시세</h1>
            <p>실시간 시세변동 기록</p>
        </div>

        <button id="refreshButton">
            ↻ 새로고침
        </button>
    </header>


    <!-- 검색 / 필터 -->
    <section class="control-panel">

        <input
            type="text"
            id="searchInput"
            placeholder="아이템 검색..."
            autocomplete="off"
        >

        <select id="itemFilter">
            <option value="">전체 아이템</option>
        </select>

    </section>


    <!-- 상태 -->
    <div class="status">

        <span id="statusText">
            데이터를 불러오는 중...
        </span>

        <span id="lastUpdated"></span>

    </div>


    <!-- 변동 기록 -->
    <main>

        <div class="section-title">
            <h2>시세변동 기록</h2>

            <span id="recordCount">
                0건
            </span>
        </div>


        <div id="historyList" class="history-list">

            <div class="loading">
                데이터를 불러오는 중...
            </div>

        </div>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
