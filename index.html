<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>띵타이쿤 시세</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans KR",
                sans-serif;

            background: #0f1117;
            color: #f1f3f5;
        }

        header {
            border-bottom: 1px solid #252936;
            background: #151821;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
            padding: 18px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
        }

        .status {
            font-size: 13px;
            color: #8f96a3;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px 60px;
        }

        /* 검색 */

        .search-box {
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 16px;

            border: 1px solid #2b3040;
            border-radius: 10px;

            background: #181b24;
            color: white;

            font-size: 15px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #5865f2;
        }

        /* 카드 */

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .item-card {
            background: #181b24;
            border: 1px solid #272c39;
            border-radius: 14px;

            padding: 18px;

            cursor: pointer;

            transition:
                transform .15s,
                border-color .15s,
                background .15s;
        }

        .item-card:hover {
            transform: translateY(-2px);
            border-color: #41485a;
            background: #1c202a;
        }

        .item-name {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .price {
            font-size: 27px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .price-unit {
            font-size: 13px;
            color: #8f96a3;
            margin-left: 3px;
        }

        .change {
            margin-top: 9px;
            font-size: 14px;
            font-weight: 600;
        }

        .up {
            color: #4ade80;
        }

        .down {
            color: #f87171;
        }

        .same {
            color: #9ca3af;
        }

        .item-time {
            margin-top: 12px;
            font-size: 12px;
            color: #717886;
        }

        /* 그래프 */

        .chart-section {
            margin-top: 35px;

            background: #181b24;
            border: 1px solid #272c39;
            border-radius: 14px;

            padding: 22px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 18px;
            font-weight: 700;
        }

        .chart-wrapper {
            height: 350px;
            position: relative;
        }

        /* 기록 */

        .history-section {
            margin-top: 25px;

            background: #181b24;
            border: 1px solid #272c39;
            border-radius: 14px;

            overflow: hidden;
        }

        .history-title {
            padding: 18px 20px;
            font-weight: 700;
            border-bottom: 1px solid #272c39;
        }

        .history-list {
            max-height: 350px;
            overflow-y: auto;
        }

        .history-row {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr;

            padding: 13px 20px;

            border-bottom: 1px solid #222631;

            font-size: 14px;
        }

        .history-row:last-child {
            border-bottom: none;
        }

        .history-date {
            color: #8f96a3;
        }

        /* 로딩 */

        .loading {
            text-align: center;
            padding: 50px;
            color: #8f96a3;
        }

        .error {
            padding: 20px;

            border-radius: 10px;

            background: #2a1719;
            border: 1px solid #5c272b;

            color: #ff8c91;

            margin-bottom: 20px;
        }

        /* 모바일 */

        @media (max-width: 600px) {

            main {
                padding: 20px 14px 40px;
            }

            .header-inner {
                padding: 15px;
            }

            .logo {
                font-size: 19px;
            }

            .status {
                font-size: 11px;
            }

            .items-grid {
                grid-template-columns: 1fr;
            }

            .chart-wrapper {
                height: 280px;
            }

            .history-row {
                grid-template-columns: 1fr 1fr;
            }

            .history-date {
                grid-column: 1 / -1;
                margin-bottom: 4px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            💰 띵타이쿤 시세
        </div>

        <div class="status" id="status">
            데이터 불러오는 중...
        </div>

    </div>

</header>


<main>

    <div id="error"></div>

    <div class="search-box">

        <input
            id="search"
            type="text"
            placeholder="아이템 검색..."
        >

    </div>


    <section>

        <div
            id="items"
            class="items-grid"
        >

            <div class="loading">
                데이터를 불러오는 중...
            </div>

        </div>

    </section>


    <section class="chart-section">

        <div class="chart-header">

            <div
                class="chart-title"
                id="chartTitle"
            >
                아이템을 선택하세요
            </div>

        </div>

        <div class="chart-wrapper">

            <canvas id="priceChart"></canvas>

        </div>

    </section>


    <section class="history-section">

        <div class="history-title">
            가격 기록
        </div>

        <div
            id="history"
            class="history-list"
        >

            <div class="loading">
                아이템을 선택하세요.
            </div>

        </div>

    </section>

</main>


<script>

    /*
    ============================================================
    API 주소
    ============================================================

    여기에 네가 현재 배포해놓은 API 주소를 넣어.

    예:

    const API_URL =
        "https://script.googleusercontent.com/macros/echo?...";

    ============================================================
    */

    const API_URL =
        "여기에_네_API_주소";


    let allData = [];

    let selectedItem = null;

    let chart = null;


    /*
    ============================================================
    데이터 가져오기
    ============================================================
    */

    async function loadData() {

        try {

            showError("");

            const response =
                await fetch(API_URL, {
                    cache: "no-store"
                });

            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );

            }

            const json =
                await response.json();


            if (!json.success) {

                throw new Error(
                    "API에서 success=false를 반환했습니다."
                );

            }


            allData =
                Array.isArray(json.data)
                    ? json.data
                    : [];


            document.getElementById("status").textContent =
                `${json.count ?? allData.length}개 기록`;


            renderItems();


            /*
            첫 아이템 자동 선택
            */

            const items =
                getItems();

            if (
                items.length > 0 &&
                !selectedItem
            ) {

                selectItem(items[0]);

            }
            else if (selectedItem) {

                /*
                기존 선택 아이템 갱신
                */

                selectItem(selectedItem, false);

            }


        } catch (error) {

            console.error(error);

            document.getElementById("status").textContent =
                "불러오기 실패";

            showError(
                "시세 데이터를 불러오지 못했습니다.<br>" +
                error.message
            );

        }

    }


    /*
    ============================================================
    아이템 목록
    ============================================================
    */

    function getItems() {

        const map =
            new Map();


        for (const row of allData) {

            if (!row.정규화) {
                continue;
            }

            if (!map.has(row.정규화)) {

                map.set(
                    row.정규화,
                    {
                        name: row.아이템,
                        normalized: row.정규화
                    }
                );

            }

        }


        return [...map.values()];

    }


    /*
    ============================================================
    각 아이템의 최신 데이터
    ============================================================
    */

    function getLatest(normalized) {

        const rows =
            allData
                .filter(
                    x => x.정규화 === normalized
                )
                .sort(
                    (a, b) =>
                        new Date(a.시간) -
                        new Date(b.시간)
                );


        return rows[rows.length - 1];

    }


    /*
    ============================================================
    카드 렌더링
    ============================================================
    */

    function renderItems() {

        const container =
            document.getElementById("items");


        const keyword =
            document
                .getElementById("search")
                .value
                .trim()
                .toLowerCase();


        let items =
            getItems();


        if (keyword) {

            items =
                items.filter(item =>
                    item.name
                        .toLowerCase()
                        .includes(keyword)
                );

        }


        if (items.length === 0) {

            container.innerHTML = `
                <div class="loading">
                    검색 결과가 없습니다.
                </div>
            `;

            return;

        }


        container.innerHTML =
            items
                .map(item => {

                    const latest =
                        getLatest(
                            item.normalized
                        );


                    if (!latest) {
                        return "";
                    }


                    const change =
                        Number(
                            latest.변동 || 0
                        );

                    const rate =
                        Number(
                            latest.변동률 || 0
                        );


                    let changeClass =
                        "same";

                    let arrow =
                        "−";


                    if (change > 0) {

                        changeClass =
                            "up";

                        arrow =
                            "▲";

                    }
                    else if (change < 0) {

                        changeClass =
                            "down";

                        arrow =
                            "▼";

                    }


                    return `

                        <div
                            class="item-card"
                            onclick='selectItemById(${JSON.stringify(item.normalized)})'
                        >

                            <div class="item-name">
                                ${escapeHtml(item.name)}
                            </div>

                            <div class="price">
                                ${formatNumber(latest.가격)}
                                <span class="price-unit">
                                    골드
                                </span>
                            </div>

                            <div class="change ${changeClass}">

                                ${arrow}
                                ${change >= 0 ? "+" : ""}
                                ${formatNumber(change)}

                                (${rate >= 0 ? "+" : ""}
                                ${rate.toFixed(2)}%)

                            </div>

                            <div class="item-time">
                                ${formatDate(latest.시간)}
                            </div>

                        </div>

                    `;

                })
                .join("");

    }


    /*
    ============================================================
    아이템 선택
    ============================================================
    */

    function selectItemById(id) {

        selectItem(id);

    }


    function selectItem(id, updateChart = true) {

        selectedItem = id;


        const item =
            getItems()
                .find(
                    x =>
                        x.normalized === id
                );


        if (!item) {
            return;
        }


        document.getElementById(
            "chartTitle"
        ).textContent =
            `${item.name} 가격 변동`;


        if (updateChart) {

            renderChart(id);

        }
        else {

            renderChart(id);

        }


        renderHistory(id);

    }


    /*
    ============================================================
    그래프
    ============================================================
    */

    function renderChart(normalized) {

        const rows =
            allData
                .filter(
                    x =>
                        x.정규화 === normalized
                )
                .sort(
                    (a, b) =>
                        new Date(a.시간) -
                        new Date(b.시간)
                );


        const labels =
            rows.map(
                x =>
                    formatDate(x.시간)
            );


        const prices =
            rows.map(
                x =>
                    Number(x.가격)
            );


        const ctx =
            document
                .getElementById("priceChart")
                .getContext("2d");


        if (chart) {

            chart.destroy();

        }


        chart =
            new Chart(
                ctx,
                {
                    type: "line",

                    data: {

                        labels,

                        datasets: [

                            {

                                label: "가격",

                                data: prices,

                                borderWidth: 2,

                                pointRadius: 2,

                                pointHoverRadius: 5,

                                tension: 0.25,

                                fill: false

                            }

                        ]

                    },

                    options: {

                        responsive: true,

                        maintainAspectRatio: false,

                        interaction: {

                            intersect: false,

                            mode: "index"

                        },

                        plugins: {

                            legend: {

                                display: false

                            },

                            tooltip: {

                                callbacks: {

                                    label: function(context) {

                                        return (
                                            formatNumber(
                                                context.parsed.y
                                            )
                                            + " 골드"
                                        );

                                    }

                                }

                            }

                        },

                        scales: {

                            x: {

                                ticks: {

                                    color: "#8f96a3",

                                    maxTicksLimit: 8

                                },

                                grid: {

                                    color: "#242833"

                                }

                            },

                            y: {

                                ticks: {

                                    color: "#8f96a3",

                                    callback: function(value) {

                                        return formatNumber(value);

                                    }

                                },

                                grid: {

                                    color: "#242833"

                                }

                            }

                        }

                    }

                }

            );

    }


    /*
    ============================================================
    가격 기록
    ============================================================
    */

    function renderHistory(normalized) {

        const container =
            document.getElementById(
                "history"
            );


        const rows =
            allData
                .filter(
                    x =>
                        x.정규화 === normalized
                )
                .sort(
                    (a, b) =>
                        new Date(b.시간) -
                        new Date(a.시간)
                );


        if (rows.length === 0) {

            container.innerHTML = `
                <div class="loading">
                    기록이 없습니다.
                </div>
            `;

            return;

        }


        container.innerHTML =
            rows
                .map(row => {

                    const change =
                        Number(
                            row.변동 || 0
                        );


                    let changeClass =
                        "same";


                    if (change > 0) {

                        changeClass =
                            "up";

                    }
                    else if (change < 0) {

                        changeClass =
                            "down";

                    }


                    return `

                        <div class="history-row">

                            <div class="history-date">
                                ${formatDate(row.시간)}
                            </div>

                            <div>
                                ${formatNumber(row.가격)}
                                골드
                            </div>

                            <div class="${changeClass}">
                                ${change > 0 ? "+" : ""}
                                ${formatNumber(change)}
                            </div>

                        </div>

                    `;

                })
                .join("");

    }


    /*
    ============================================================
    검색
    ============================================================
    */

    document
        .getElementById("search")
        .addEventListener(
            "input",
            renderItems
        );


    /*
    ============================================================
    숫자 포맷
    ============================================================
    */

    function formatNumber(number) {

        return Number(
            number || 0
        ).toLocaleString("ko-KR");

    }


    /*
    ============================================================
    날짜 포맷
    ============================================================
    */

    function formatDate(dateString) {

        const date =
            new Date(dateString);


        if (Number.isNaN(date.getTime())) {

            return dateString;

        }


        return date.toLocaleString(
            "ko-KR",
            {
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    /*
    ============================================================
    XSS 방지
    ============================================================
    */

    function escapeHtml(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    /*
    ============================================================
    오류 표시
    ============================================================
    */

    function showError(message) {

        const element =
            document.getElementById("error");

        element.innerHTML =
            message
                ? `<div class="error">${message}</div>`
                : "";

    }


    /*
    ============================================================
    최초 실행
    ============================================================
    */

    loadData();


    /*
    ============================================================
    자동 갱신
    ============================================================

    1분마다 API를 다시 가져옴

    ============================================================
    */

    setInterval(
        loadData,
        60 * 1000
    );

</script>

</body>
</html>
