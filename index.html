<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>띵타 유저상점 시세</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div class="container">

    <div class="header">

        <div>
            <div class="title">
                띵타 유저상점 시세
            </div>

            <div class="subtitle">
                실시간 아이템 시장 가격
            </div>
        </div>

        <input
            id="search"
            class="search"
            placeholder="아이템 검색..."
            oninput="render()"
        >

    </div>


    <div class="market-bar">

        <div>
            <strong>
                전체 시장
            </strong>
        </div>

        <div
            id="status"
            class="market-status"
        >
            데이터 불러오는 중...
        </div>

    </div>


    <div
        id="grid"
        class="grid"
    >

        <div class="loading">
            시세 데이터를 불러오는 중...
        </div>

    </div>

</div>


<div
    id="detail"
    class="detail"
    onclick="closeDetail(event)"
>

    <div
        class="detail-box"
        onclick="event.stopPropagation()"
    >

        <div
            class="detail-close"
            onclick="closeDetail()"
        >
            ×
        </div>


        <div
            id="detailName"
            class="detail-name"
        ></div>


        <div
            id="detailPrice"
            class="detail-price"
        ></div>


        <div
            id="detailChange"
            class="detail-change"
        ></div>


        <div class="detail-grid">

            <div class="detail-stat">

                <div class="detail-label">
                    현재 가격
                </div>

                <div
                    id="statCurrent"
                    class="detail-value"
                ></div>

            </div>


            <div class="detail-stat">

                <div class="detail-label">
                    이전 가격
                </div>

                <div
                    id="statPrevious"
                    class="detail-value"
                ></div>

            </div>


            <div class="detail-stat">

                <div class="detail-label">
                    거래 횟수
                </div>

                <div
                    id="statTransactions"
                    class="detail-value"
                ></div>

            </div>

        </div>


        <div class="history-title">

            <span>
                가격 기록
            </span>

            <span
                id="historyCount"
                class="history-count"
            ></span>

        </div>


        <div
            id="history"
            class="history"
        >

            <div class="no-history">
                가격 기록을 불러오는 중...
            </div>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
